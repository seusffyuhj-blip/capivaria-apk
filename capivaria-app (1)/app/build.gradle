plugins {
    id 'com.android.application'
}

android {
    namespace 'br.store.capivariashop'
    compileSdk 34

    defaultConfig {
        applicationId "br.store.capivariashop"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Só para desenhar o QR Code do Pix a partir do código recebido da loja
    implementation 'com.google.zxing:core:3.5.3'
}
