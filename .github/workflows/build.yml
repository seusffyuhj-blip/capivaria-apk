name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encontrar a pasta do projeto Android
        id: find
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path "*/.git/*" -not -path "*/build/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Não achei settings.gradle no repositório. Suba o conteúdo do zip (pasta app, settings.gradle, build.gradle...)."
            find . -not -path "./.git/*" | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Projeto em: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Baixar a logo da loja (se ainda não estiver no projeto)
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          mkdir -p "$DIR/app/src/main/res/drawable-nodpi"
          if [ ! -s "$DIR/app/src/main/res/drawable-nodpi/logo_capivaria.png" ]; then
            curl -fsSL "https://capivariashopbr.store/__l5e/assets-v1/9488f642-2358-468f-93e1-fe1ab185d52e/logo-capivaria.png" \
              -o "$DIR/app/src/main/res/drawable-nodpi/logo_capivaria.png"
          fi
          file "$DIR/app/src/main/res/drawable-nodpi/logo_capivaria.png"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle -p "${{ steps.find.outputs.dir }}" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapivariaShop-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
